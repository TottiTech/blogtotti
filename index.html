<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totti Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           ROOT VARIABLES – CHANGE COLORS HERE
           ============================================ */
        :root {
            --bg: #faf9f6;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --accent: #1a1a1a;
            --accent-light: #e8e5e0;
            --border: #e5e2dc;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
            --max-width: 1100px;
            --card-radius: 12px;
        }

        /* ============================================
           RESET & BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        img {
            max-width: 100%;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ============================================
           HEADER & NAVIGATION
           ============================================ */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(250, 249, 246, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.2s ease;
            letter-spacing: 0.02em;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        /* ============================================
           HERO SECTION
           ============================================ */
        .hero {
            margin-top: 72px;
            padding: 80px 24px 60px;
            text-align: center;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .hero-content {
            max-width: 640px;
            margin: 0 auto;
        }

        .hero h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .hero p {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* ============================================
           MAIN CONTENT
           ============================================ */
        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        /* ============================================
           POST GRID
           ============================================ */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 32px;
            padding-top: 48px;
        }

        .post-card {
            background: var(--surface);
            border-radius: var(--card-radius);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
        }

        .post-card-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: var(--accent-light);
        }

        .post-card-body {
            padding: 24px;
            flex: 1;
        }

        .post-card-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .post-card-title {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 10px;
            letter-spacing: -0.01em;
        }

        .post-card-excerpt {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .post-card-footer {
            padding: 0 24px 24px;
        }

        .post-card-read-more {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: gap 0.2s ease;
        }

        .post-card:hover .post-card-read-more {
            gap: 10px;
        }

        /* ============================================
           EMPTY STATE
           ============================================ */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* ============================================
           ABOUT SECTION
           ============================================ */
        .about-section {
            display: none;
            max-width: 720px;
            margin: 0 auto;
            padding: 160px 24px 80px;
        }

        .about-section.active {
            display: block;
        }

        .about-section h2 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }

        .about-section p {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .about-section .highlight {
            color: var(--text);
            font-weight: 500;
        }

        /* ============================================
           POST VIEW (single post)
           ============================================ */
        .post-view {
            display: none;
            max-width: 720px;
            margin: 0 auto;
            padding: 120px 24px 80px;
        }

        .post-view.active {
            display: block;
        }

        .post-view .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 32px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .post-view .back-link:hover {
            color: var(--text);
        }

        .post-view h1 {
            font-family: var(--font-serif);
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .post-view .post-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            display: flex;
            gap: 16px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .post-view .post-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text);
        }

        .post-view .post-content p {
            margin-bottom: 24px;
        }

        .post-view .post-content h2 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            margin: 40px 0 16px;
            letter-spacing: -0.01em;
        }

        .post-view .post-content img {
            border-radius: var(--card-radius);
            margin: 32px 0;
        }

        .post-view .post-content blockquote {
            border-left: 3px solid var(--accent-light);
            padding-left: 20px;
            margin: 32px 0;
            font-style: italic;
            color: var(--text-muted);
        }

        .post-view .post-content a {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* ============================================
           FOOTER
           ============================================ */
        footer {
            border-top: 1px solid var(--border);
            padding: 32px 24px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 640px) {
            .nav-links {
                gap: 20px;
            }

            .hero {
                padding: 60px 20px 40px;
            }

            .post-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .post-card-image {
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================
         HEADER / NAVIGATION
         ========================================== -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo" onclick="showHome(); return false;">Totti Blog</a>
            <ul class="nav-links">
                <li><a href="#" id="nav-home" class="active" onclick="showHome(); return false;">Home</a></li>
                <li><a href="#" id="nav-about" onclick="showAbout(); return false;">About Me</a></li>
            </ul>
        </div>
    </header>

    <!-- ==========================================
         HOME VIEW
         ========================================== -->
    <div id="home-view">
        <section class="hero">
            <div class="hero-content">
                <h1>Computação Visual - 2026/2</h1>
                <p>Um blog sobre o conteúdo discutido na matéria.</p>
            </div>
        </section>

        <main>
            <div class="post-grid" id="post-grid">
                <!-- Posts are rendered here automatically -->
            </div>
        </main>
    </div>

    <!-- ==========================================
         ABOUT VIEW
         ========================================== -->
    <div id="about-view" class="about-section">
        <h2>About Me</h2>
        <p>
            Olá! Eu sou o <span class="highlight">Totti</span>, e esse é meu blog.
        </p>
        <p>
            Placeholder da preguiça
        </p>
    </div>

    <!-- ==========================================
         SINGLE POST VIEW
         ========================================== -->
    <div id="post-view" class="post-view">
        <div class="back-link" onclick="showHome()">
            ← Voltar para home
        </div>
        <h1 id="post-view-title"></h1>
        <div class="post-meta" id="post-view-meta"></div>
        <div class="post-content" id="post-view-content"></div>
    </div>

    <!-- ==========================================
         FOOTER
         ========================================== -->
    <footer>
        <p>&copy; 2026 Totti Blog. All rights reserved.</p>
    </footer>

    <!-- ==========================================
         LOAD POSTS DATA
         This MUST come before the script below.
         ========================================== -->
    <script src="posts.js"></script>

    <!-- ==========================================
         RENDERING LOGIC
         You generally don't need to edit this.
         ========================================== -->
    <script>
        const postGrid = document.getElementById('post-grid');
        const homeView = document.getElementById('home-view');
        const aboutView = document.getElementById('about-view');
        const postView = document.getElementById('post-view');
        const navHome = document.getElementById('nav-home');
        const navAbout = document.getElementById('nav-about');

        /* Turn "2026-03-15" into "March 15, 2026" */
        function formatDate(isoString) {
            const d = new Date(isoString + 'T00:00:00');
            if (isNaN(d)) return isoString;
            return d.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        /* Only show published posts, newest first */
        function getVisiblePosts() {
            return posts
                .filter(post => post.published === true)
                .sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        function renderPosts() {
            const visible = getVisiblePosts();
            postGrid.innerHTML = '';

            if (visible.length === 0) {
                postGrid.innerHTML = `
                    <p class="empty-state">
                        No posts yet — check back soon!
                    </p>
                `;
                return;
            }

            visible.forEach(post => {
                const card = document.createElement('article');
                card.className = 'post-card';
                card.onclick = () => openPost(post.id);

                card.innerHTML = `
                    <img
                        class="post-card-image"
                        src="${post.image}"
                        alt="${post.title}"
                        loading="lazy"
                    >
                    <div class="post-card-body">
                        <div class="post-card-meta">
                            <span>${formatDate(post.date)}</span>
                            <span>·</span>
                            <span>${post.category}</span>
                        </div>
                        <h2 class="post-card-title">${post.title}</h2>
                        <p class="post-card-excerpt">${post.excerpt}</p>
                    </div>
                    <div class="post-card-footer">
                        <span class="post-card-read-more">Read more →</span>
                    </div>
                `;

                postGrid.appendChild(card);
            });
        }

        function showHome() {
            homeView.style.display = 'block';
            aboutView.classList.remove('active');
            postView.classList.remove('active');
            navHome.classList.add('active');
            navAbout.classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showAbout() {
            homeView.style.display = 'none';
            aboutView.classList.add('active');
            postView.classList.remove('active');
            navHome.classList.remove('active');
            navAbout.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openPost(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;

            homeView.style.display = 'none';
            aboutView.classList.remove('active');
            postView.classList.add('active');
            navHome.classList.remove('active');
            navAbout.classList.remove('active');

            document.getElementById('post-view-title').textContent = post.title;
            document.getElementById('post-view-meta').innerHTML = `
                <span>${formatDate(post.date)}</span>
                <span>·</span>
                <span>${post.category}</span>
            `;
            document.getElementById('post-view-content').innerHTML = post.content;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* Boot up */
        if (typeof posts === 'undefined') {
            postGrid.innerHTML = `
                <p class="empty-state">
                    ⚠️ Could not find posts.js — make sure it's in the same folder as index.html.
                </p>
            `;
        } else {
            console.log(`Totti Blog loaded: ${getVisiblePosts().length} published, ${posts.length - getVisiblePosts().length} hidden.`);
            renderPosts();
            showHome();
        }
    </script>

</body>
</html>
