<style>
    :root {
        --bg-color: #f6f4f0;
        --text-dark: #333333;
        --text-light: #555555;
        --border-color: #e5e0d8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg-color);
        color: var(--text-dark);
        font-family: 'Inter', sans-serif;
        line-height: 1.6;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 2rem 5%;
        border-bottom: 1px solid var(--border-color);
    }

    .logo {
        font-family: 'Cormorant Garamond', serif;
        font-size: 2.2rem;
        font-weight: 300;
        letter-spacing: -0.5px;
        color: var(--text-dark);
        text-decoration: none;
        flex: 1;
    }

    nav {
        flex: 1;
        display: flex;
        justify-content: center;
        gap: 2.5rem;
    }

    nav a {
        text-decoration: none;
        color: var(--text-dark);
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 1.5px;
        text-transform: lowercase;
    }

    .header-spacer { flex: 1; }

    main {
        padding: 4rem 5%;
        max-width: 1400px;
        margin: 0 auto;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 3rem;
        padding-left: 1rem;
    }

    .section-title {
        font-family: 'Mrs Saint Delafield', cursive;
        font-size: 4rem;
        font-weight: 400;
        color: var(--text-dark);
        transform: rotate(-3deg);
    }

    .post-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2.5rem;
    }

    .post-card {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
    }

    .post-image {
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        background-color: #e5e0d8;
    }

    .post-title {
        font-size: 0.95rem;
        font-weight: 400;
        color: var(--text-light);
    }
</style>
<header>
    <a href="#" class="logo">Totti Blog</a>
    <nav>
        <a href="#">home</a>
        <a href="#">about</a>
    </nav>
    <div class="header-spacer"></div>
</header>

<main>
    <section class="blog-section">
        <div class="section-header">
            <h1 class="section-title">featured posts</h1>
            <div class="nav-arrows">< ></div>
        </div>

        <div class="post-grid">
            <article class="post-card">
                <img src="image_c1a5a3.jpg" alt="Living Room" class="post-image">
                <p class="post-title">Tour our Living Room & Lounge</p>
            </article>

            <article class="post-card">
                <img src="[https://images.unsplash.com/photo-1556910103-1c02745a872e?auto=format&fit=crop&q=80&w=800](https://images.unsplash.com/photo-1556910103-1c02745a872e?auto=format&fit=crop&q=80&w=800)" alt="Kitchen" class="post-image">
                <p class="post-title">Full Kitchen Tour</p>
            </article>

            <article class="post-card">
                <img src="[https://images.unsplash.com/photo-1593640408182-31c70c8268f5?auto=format&fit=crop&q=80&w=800](https://images.unsplash.com/photo-1593640408182-31c70c8268f5?auto=format&fit=crop&q=80&w=800)" alt="Office" class="post-image">
                <p class="post-title">2026 Home Office Tour</p>
            </article>
        </div>
    </section>
</main>
